name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE_NAME: transport-express-frontend
  BACKEND_IMAGE_NAME: transport-express-backend
  FRONTEND_PUBLIC_API_BASE_URL: ${{ secrets.FRONTEND_PUBLIC_API_BASE_URL }}
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/transport-express' }}
  FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '4000' }}
  BACKEND_PORT: ${{ vars.BACKEND_PORT || '4002' }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
  CARRIER_API_TIMEOUT_MS: ${{ vars.CARRIER_API_TIMEOUT_MS || '5000' }}
  GHTK_ENABLED: ${{ vars.GHTK_ENABLED || 'true' }}
  GHTK_MOCK_MODE: ${{ vars.GHTK_MOCK_MODE || 'true' }}
  GHTK_API_BASE_URL: ${{ vars.GHTK_API_BASE_URL || 'https://partner-api.example.com/ghtk' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi

          if [ -n "$BASE_SHA" ] && ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi

          frontend=false
          backend=false
          shared=false

          if [ -z "$BASE_SHA" ]; then
            shared=true
            changed_files="__force_build_all__"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          echo "Diff base: ${BASE_SHA:-none}"
          echo "Changed files:"
          echo "$changed_files"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              apps/frontend/*)
                frontend=true
                ;;
              apps/backend/*)
                backend=true
                ;;
              *)
                shared=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$shared" = true ]; then
            frontend=true
            backend=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/${FRONTEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.FRONTEND_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-backend:
    name: Build backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/${BACKEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to VPS
    needs:
      - changes
      - build-frontend
      - build-backend
    if: always() && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy selected services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ vars.VPS_PASSWORD }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          script: |
            set -e

            APP_DIR="${{ env.VPS_APP_DIR }}"
            FRONTEND_PORT="${{ env.FRONTEND_PORT }}"
            BACKEND_PORT="${{ env.BACKEND_PORT }}"
            FRONTEND_ORIGIN="${{ env.FRONTEND_ORIGIN }}"
            FRONTEND_PUBLIC_API_BASE_URL="${{ env.FRONTEND_PUBLIC_API_BASE_URL }}"
            CARRIER_API_TIMEOUT_MS="${{ env.CARRIER_API_TIMEOUT_MS }}"
            GHTK_ENABLED="${{ env.GHTK_ENABLED }}"
            GHTK_MOCK_MODE="${{ env.GHTK_MOCK_MODE }}"
            GHTK_API_BASE_URL="${{ env.GHTK_API_BASE_URL }}"
            GHTK_API_TOKEN="${{ secrets.GHTK_API_TOKEN }}"

            [ -z "$APP_DIR" ] && APP_DIR="/opt/transport-express"
            [ -z "$FRONTEND_PORT" ] && FRONTEND_PORT="4000"
            [ -z "$BACKEND_PORT" ] && BACKEND_PORT="4002"
            [ -z "$FRONTEND_ORIGIN" ] && FRONTEND_ORIGIN="http://localhost:$FRONTEND_PORT"
            [ -z "$FRONTEND_PUBLIC_API_BASE_URL" ] && FRONTEND_PUBLIC_API_BASE_URL="http://localhost:$BACKEND_PORT"
            [ -z "$CARRIER_API_TIMEOUT_MS" ] && CARRIER_API_TIMEOUT_MS="5000"
            [ -z "$GHTK_ENABLED" ] && GHTK_ENABLED="true"
            [ -z "$GHTK_MOCK_MODE" ] && GHTK_MOCK_MODE="true"
            [ -z "$GHTK_API_BASE_URL" ] && GHTK_API_BASE_URL="https://partner-api.example.com/ghtk"
            [ -z "$GHTK_API_TOKEN" ] && GHTK_API_TOKEN="replace_me"

            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            FRONTEND_IMAGE="ghcr.io/$OWNER/${{ env.FRONTEND_IMAGE_NAME }}:latest"
            BACKEND_IMAGE="ghcr.io/$OWNER/${{ env.BACKEND_IMAGE_NAME }}:latest"

            mkdir -p "$APP_DIR"

            cat > "$APP_DIR/docker-compose.prod.yml" <<'EOF'
            services:
              backend:
                image: ${BACKEND_IMAGE}
                container_name: transport-express-backend
                restart: unless-stopped
                ports:
                  - "${BACKEND_PORT:-4002}:4002"
                env_file:
                  - ./backend.env

              frontend:
                image: ${FRONTEND_IMAGE}
                container_name: transport-express-frontend
                restart: unless-stopped
                ports:
                  - "${FRONTEND_PORT:-4000}:3000"
                depends_on:
                  - backend
            EOF

            cat > "$APP_DIR/.env" <<EOF
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_PORT=$FRONTEND_PORT
            BACKEND_PORT=$BACKEND_PORT
            EOF

            cat > "$APP_DIR/backend.env" <<EOF
            NODE_ENV=production
            PORT=4002
            FRONTEND_ORIGIN=$FRONTEND_ORIGIN
            CARRIER_API_TIMEOUT_MS=$CARRIER_API_TIMEOUT_MS
            GHTK_ENABLED=$GHTK_ENABLED
            GHTK_MOCK_MODE=$GHTK_MOCK_MODE
            GHTK_API_BASE_URL=$GHTK_API_BASE_URL
            GHTK_API_TOKEN=$GHTK_API_TOKEN
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ vars.GHCR_USERNAME }}" --password-stdin

            cd "$APP_DIR"

            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
              docker compose -f docker-compose.prod.yml pull backend
              docker compose -f docker-compose.prod.yml up -d backend
            fi

            if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
              docker compose -f docker-compose.prod.yml pull frontend
              docker compose -f docker-compose.prod.yml up -d frontend
            fi

            docker image prune -f
